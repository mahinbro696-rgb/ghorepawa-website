name: Portal validation
on:
  push:
    branches: [feature/portal-management-v2]
  pull_request:
    branches: [deploy/exonhost-node24]
permissions:
  contents: read
concurrency:
  group: portal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: python -m pip install playwright==1.64.0
      - run: python -m playwright install --with-deps chromium
      - name: Browser regression tests (synthetic API fixtures)
        run: python tests/ui/portal-browser.py
      - name: Package changed deployment files only
        run: python scripts/package_portal.py
      - name: Archive source and test evidence
        if: always()
        run: |
          mkdir -p portal-ci-output
          git archive --format=tar.gz --output=portal-ci-output/portal-source.tar.gz HEAD
          if [ -d .test-results/screenshots ]; then cp -r .test-results/screenshots portal-ci-output/; fi
          if [ -f .test-results/ghorepawa-portal-v2-update.zip ]; then cp .test-results/ghorepawa-portal-v2-update.zip portal-ci-output/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-validation
          path: portal-ci-output/
          retention-days: 7
