name: Glass Workflow v3 review
on:
  push:
    branches: [feature/glass-workflow-v3]
    paths: [.github/workflows/glass-workflow-review.yml]
permissions:
  contents: write
concurrency:
  group: glass-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    if: github.repository == 'mahinbro696-rgb/ghorepawa-website' && github.ref == 'refs/heads/feature/glass-workflow-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/glass-workflow-v3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source transport and apply to isolated branch
        shell: bash
        run: |
          if [ ! -f WORKFLOW-V3-MANIFEST.json ]; then
            python - <<'PY'
          import pathlib, base64, lzma, hashlib
          encoded = ''.join(pathlib.Path(f'.glass-transport/part{i}.txt').read_text().strip() for i in range(1,5))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '7c62e64258d6eccfee3719418e4e76aab54acd1411b49317251bf8f286518ad6', 'Patch checksum mismatch'
          pathlib.Path('/tmp/glass-v3.patch').write_bytes(patch)
          print('Verified patch:', len(patch), 'bytes')
          PY
            git apply --check /tmp/glass-v3.patch
            git apply --index /tmp/glass-v3.patch
          fi
          mkdir -p glass-ci-output
      - run: npm ci
      - name: Source checks
        run: npm run check | tee glass-ci-output/check.log
      - name: Isolated PostgreSQL and workflow tests
        run: npm test | tee glass-ci-output/tests.log
      - name: Static build
        run: npm run build | tee glass-ci-output/build.log
      - name: Publish checked application source only
        shell: bash
        run: |
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Implement Glass Workflow v3: private moderator tasks, callback routing and explicit order erasure'
            git push origin HEAD:refs/heads/feature/glass-workflow-v3
          fi
      - run: python -m pip install playwright==1.64.0
      - run: python -m playwright install --with-deps chromium
      - name: Font support for Bengali test rendering
        run: sudo apt-get install -y fonts-noto-core
      - name: Existing portal browser regression
        run: python tests/ui/portal-browser.py | tee glass-ci-output/browser-regression.log
      - name: Real HTTP API browser workflow acceptance
        run: python tests/ui/workflow-browser.py | tee glass-ci-output/browser-workflow.log
      - name: Package only the sixteen deployment files
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, json, hashlib, zipfile
          manifest = json.loads(pathlib.Path('WORKFLOW-V3-MANIFEST.json').read_text())
          files = manifest['newFiles'] + manifest['modifiedFiles']
          assert len(files) == 16
          hashes = {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in files}
          with zipfile.ZipFile('glass-ci-output/ghorepawa-workflow-v3-update.zip', 'w', zipfile.ZIP_DEFLATED) as z:
            for p in files + ['WORKFLOW-V3-MANIFEST.json','WORKFLOW-V3-DEPLOY.md']:
              z.write(p,p)
            z.writestr('WORKFLOW-V3-SHA256.json',json.dumps(hashes,indent=2)+'\n')
          print('Packaged 16 application files; no credentials, customer records or dependencies.')
          PY
      - name: Preserve source and diagnostic evidence
        if: always()
        shell: bash
        run: |
          mkdir -p glass-ci-output
          git archive --format=tar.gz --output=glass-ci-output/glass-reviewed-source.tar.gz HEAD
          git rev-parse HEAD > glass-ci-output/source-commit.txt
          if [ -d .test-results/screenshots ]; then cp -r .test-results/screenshots glass-ci-output/; fi
          if [ -d .test-results/screenshots-v3 ]; then cp -r .test-results/screenshots-v3 glass-ci-output/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glass-workflow-v3-review
          path: glass-ci-output/
          retention-days: 7
