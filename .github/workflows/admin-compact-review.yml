name: Admin compact review
on:
  push:
    branches: [feature/admin-compact-polish]
  pull_request:
    branches: [feature/admin-compact-polish]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: admin-compact-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir -p compact-ci
      - run: npm ci
      - name: Source and asset checks
        run: npm run check 2>&1 | tee compact-ci/check.log
      - name: Isolated SQL workflow regression
        run: npm test 2>&1 | tee compact-ci/tests.log
      - name: Static build
        run: npm run build 2>&1 | tee compact-ci/build.log
      - run: python -m pip install playwright==1.64.0
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-core
      - name: Compact layout, cache, selection and storefront browser regression
        run: python tests/ui/capture-runner.py tests/ui/portal-browser.py 2>&1 | tee compact-ci/browser-regression.log
      - name: Real API order, moderator, callback and deletion acceptance
        if: ${{ !cancelled() }}
        run: python tests/ui/capture-runner.py tests/ui/workflow-browser.py 2>&1 | tee compact-ci/browser-workflow.log
      - name: Package three admin-only deployment files
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib,json
          manifest=json.loads(pathlib.Path('ADMIN-COMPACT-MANIFEST.json').read_text())
          files=manifest['newFiles']+manifest['modifiedFiles']
          assert len(files)==3
          docs=['ADMIN-COMPACT-MANIFEST.json','ADMIN-COMPACT-START-BN.md','ADMIN-COMPACT-TEST-REPORT.md']
          with zipfile.ZipFile('compact-ci/ghorepawa-admin-compact-update.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in files+docs:z.write(p,p)
            z.writestr('ADMIN-COMPACT-SHA256.json',json.dumps({p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in files},indent=2)+'\n')
          PY
      - name: Preserve source and diagnostics
        if: always()
        run: |
          mkdir -p compact-ci
          git archive --format=tar.gz --output=compact-ci/reviewed-source.tar.gz HEAD
          git rev-parse HEAD > compact-ci/source-commit.txt
          if [ -d .test-results/screenshots ]; then cp -r .test-results/screenshots compact-ci/; fi
          if [ -d .test-results/screenshots-v3 ]; then cp -r .test-results/screenshots-v3 compact-ci/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-compact-review
          path: compact-ci/
          retention-days: 7
