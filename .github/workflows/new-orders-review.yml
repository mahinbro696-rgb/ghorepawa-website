name: New orders queue review
on:
  push:
    branches: [feature/admin-new-orders-queue]
permissions:
  contents: read
concurrency:
  group: new-orders-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    if: github.repository == 'mahinbro696-rgb/ghorepawa-website' && github.ref == 'refs/heads/feature/admin-new-orders-queue'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir -p new-orders-ci
      - run: npm ci
      - name: Syntax and asset validation
        run: npm run check 2>&1 | tee new-orders-ci/check.log
      - name: Isolated SQL and permission tests
        run: npm test 2>&1 | tee new-orders-ci/tests.log
      - name: Static build
        run: npm run build 2>&1 | tee new-orders-ci/build.log
      - run: python -m pip install playwright==1.64.0
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-core
      - name: Existing presentation regression
        run: python tests/ui/portal-browser.py 2>&1 | tee new-orders-ci/browser-regression.log
      - name: Existing real API workflow acceptance
        run: python tests/ui/workflow-browser.py 2>&1 | tee new-orders-ci/browser-workflow.log
      - name: Existing inbox and search acceptance
        run: python tests/ui/inbox-search-browser.py 2>&1 | tee new-orders-ci/browser-search.log
      - name: New orders and bulk assignment browser acceptance
        run: python tests/ui/new-orders-browser.py 2>&1 | tee new-orders-ci/browser-new-orders.log
      - name: Package only the four frontend files
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,zipfile
          manifest=json.loads(Path('NEW-ORDERS-MANIFEST.json').read_text())
          files=manifest['modifiedFiles'];assert len(files)==4 and not manifest['newFiles']
          hashes={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files}
          with zipfile.ZipFile('new-orders-ci/ghorepawa-new-orders-update.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in files+['NEW-ORDERS-MANIFEST.json','NEW-ORDERS-START-BN.md','NEW-ORDERS-TEST-REPORT.md']:
              z.write(p,p)
            z.writestr('NEW-ORDERS-SHA256.json',json.dumps(hashes,indent=2)+'\n')
          print('Packaged four frontend files. No customer data, credentials or backend changes.')
          PY
      - name: Preserve source and test evidence
        if: always()
        run: |
          mkdir -p new-orders-ci
          git archive --format=tar.gz --output=new-orders-ci/reviewed-source.tar.gz HEAD
          git rev-parse HEAD > new-orders-ci/source-commit.txt
          if [ -d .test-results/screenshots-new-orders ]; then cp -r .test-results/screenshots-new-orders new-orders-ci/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-orders-queue-review
          path: new-orders-ci/
          retention-days: 7
