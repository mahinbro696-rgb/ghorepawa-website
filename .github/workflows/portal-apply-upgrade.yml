name: Apply reviewed portal upgrade
on:
  push:
    branches: [feature/portal-management-v2]
    paths:
      - .github/workflows/portal-apply-upgrade.yml
permissions:
  contents: write
jobs:
  apply-and-validate:
    if: github.repository == 'mahinbro696-rgb/ghorepawa-website' && github.ref == 'refs/heads/feature/portal-management-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/portal-management-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply reviewed source patch
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, base64, lzma, hashlib
          text = ''.join(pathlib.Path(f'.portal-transport/part{i}.txt').read_text().strip() for i in range(1,5))
          data = lzma.decompress(base64.b64decode(text, validate=True))
          expected = 'a30a77f98c917b330955886cce75b83060a8307931277daeaa4037b7afaaf638'
          assert hashlib.sha256(data).hexdigest() == expected, 'Transport checksum mismatch; refusing to apply'
          pathlib.Path('/tmp/portal.patch').write_bytes(data)
          print('Verified reviewed patch:', len(data), 'bytes')
          PY
          git apply --check /tmp/portal.patch
          git apply --index /tmp/portal.patch
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Browser regression tests
        run: python tests/ui/portal-browser.py
      - name: Package deployment update
        run: python scripts/package_portal.py
      - name: Commit validated application source only to feature branch
        shell: bash
        run: |
          git rm -r .portal-transport
          git restore --source=HEAD --staged --worktree .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build portal v2: products, inventory, notifications, navy UI and tested workflows'
          git push origin HEAD:refs/heads/feature/portal-management-v2
      - name: Archive reviewed source tree and test evidence
        if: always()
        run: |
          mkdir -p portal-ci-output
          TREE=$(git write-tree)
          git archive --format=tar.gz --output=portal-ci-output/portal-reviewed-source.tar.gz "$TREE"
          if [ -d .test-results/screenshots ]; then cp -r .test-results/screenshots portal-ci-output/; fi
          if [ -f .test-results/ghorepawa-portal-v2-update.zip ]; then cp .test-results/ghorepawa-portal-v2-update.zip portal-ci-output/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-upgrade-validation
          path: portal-ci-output/
          retention-days: 7
